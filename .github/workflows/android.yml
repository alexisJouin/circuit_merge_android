name: Android APK and AAB
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Build signed AAB (requires upload-key secrets)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config cmake ninja-build zlib1g-dev libffi-dev libssl-dev libncurses5-dev libncursesw5-dev
          python -m pip install buildozer==1.5.0 Cython==0.29.36 setuptools==69.5.1
      - name: Build test APK
        run: buildozer -v android debug
      - name: Prepare upload key
        if: inputs.release
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" && test -n "$P4A_RELEASE_KEYSTORE_PASSWD" && test -n "$P4A_RELEASE_KEYALIAS" && test -n "$P4A_RELEASE_KEYALIAS_PASSWD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          chmod 600 "$RUNNER_TEMP/upload.jks"
      - name: Build signed AAB
        if: inputs.release
        env:
          P4A_RELEASE_KEYSTORE: ${{ runner.temp }}/upload.jks
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: buildozer -v android release
      - name: Collect APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: circuit-merge-android
          path: |
            bin/*.apk
            bin/*.aab
          if-no-files-found: error
      - name: Remove temporary upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
